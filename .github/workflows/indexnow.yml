name: IndexNow

# Avisa o IndexNow (Bing, Yandex, Seznam, Naver) das URLs novas do sitemap.
# Roda quando a Vercel termina um deploy de produção com sucesso, e à mão pela
# aba Actions. O script não importa nada do projeto, então não há `npm ci`.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  # Para achar e baixar a lista guardada pela execução anterior.
  actions: read

jobs:
  indexnow:
    # A Vercel manda um deployment_status para cada estado de cada deploy,
    # inclusive os de preview. Só o sucesso em produção interessa.
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No job, e não no workflow: no workflow, o evento de um deploy de preview
    # (que este job ignora) cancelaria uma execução de produção que estivesse
    # esperando na fila. Aqui, uma execução nova só substitui outra de produção,
    # e ela compara com o último histórico salvo, então nenhuma URL se perde.
    concurrency:
      group: indexnow
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # A lista de URLs da última execução que deu certo. Sem ela, o script
      # envia o sitemap inteiro.
      #
      # Era o cache do Actions, e ele não funciona aqui: o deployment_status
      # não está ligado a uma branch, e o cache recusa o evento com um aviso,
      # sem falhar. A primeira execução em produção (02/11) mostrou isso; com
      # o cache, todo deploy reenviaria as 1.874 URLs. O artefato não depende
      # de branch, e é o mesmo caminho que `enviar-alertas.yml` usa para pegar
      # o snapshot da coleta.
      - name: Recuperar a lista da execução anterior
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for candidata in $(gh run list --workflow=indexnow.yml --status=success \
              --limit=10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$candidata" --name indexnow-state --dir . 2>/dev/null; then
              echo "lista recuperada da execução $candidata"
              exit 0
            fi
          done
          echo "nenhuma lista anterior: o script vai enviar todas as URLs"

      - run: node scripts/indexnow.mjs

      # Só chega aqui se o envio deu certo: num erro, a lista antiga fica, e o
      # próximo deploy tenta de novo as mesmas URLs. O nome começa com ponto, e
      # o upload-artifact deixa esses arquivos de fora se não for avisado.
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: .indexnow-state.json
          include-hidden-files: true
          retention-days: 90
