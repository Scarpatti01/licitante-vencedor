# O resumo diário para as empresas cadastradas — o produto pago.
#
# Irmão de `enviar-alertas.yml`, e separado dele de propósito. São públicos
# diferentes, com consentimentos diferentes: o lead deu duplo opt-in num
# formulário público e sai por link com token; a empresa contratou e desliga o
# canal na tela dela. Um workflow só misturaria as duas regras, e é aí que este
# tipo de sistema erra feio.
#
# ## Quando sai: quando a coleta termina, nunca antes das 7h
#
# A home promete "todo dia útil, às 7h". Até 24/09/2026 isso era um `schedule`
# às 10:00 UTC, e nos 12 dias úteis medidos de 08 a 23/09 o resumo chegou entre
# 10h58 e 13h07 de Brasília — todos os dias. O agendador do GitHub atrasa sob
# carga, e atrasou de 4 a 6 horas, sempre. O conteúdo estava certo; a hora não.
#
# Agora o gatilho é a COLETA terminar (`workflow_run`), que é o momento em que
# os dados do dia existem: a triagem e a leitura são passos dela. Se ela
# terminar antes das 7h, este job espera; depois das 20h, não manda. A regra
# mora em `src/lib/resumo/janela.ts`, onde é testada, e não aqui.
#
# A coleta roda duas vezes por dia, então isto dispara duas vezes. Não sai
# e-mail duplicado: o plano manda UM resumo por empresa por dia de Brasília, e
# o que a segunda coleta trouxer depois vai no resumo do próximo dia útil —
# como já acontecia com o horário fixo. Ver `ultimoEnvio` em `resumo/plano.ts`.
#
# O `schedule` continua, como reserva: se um disparo da coleta for descartado
# pelo GitHub (a documentação diz que sob carga isso acontece), o resumo ainda
# sai. Nos dias normais ele chega depois e encontra todo mundo já atendido.
#
# ## O que acontece quando falta segredo
#
# O job termina VERDE, com um resumo dizendo o que falta. Mesma regra de
# `enviar-alertas.yml`: este workflow roda todo dia útil, e falhar sempre pelo
# mesmo motivo conhecido ensina a ignorar o X vermelho.

name: Enviar resumo diário

on:
  # O gatilho principal: a coleta terminou, com qualquer desfecho. "failure" é
  # o normal — a coleta termina assim sempre que UMA das 27 UFs cai, e publica
  # os dados do mesmo jeito. Ver `aviso-de-praca-le-a-coleta-certa.test.ts`.
  workflow_run:
    workflows: ["Coletar PNCP (paralelo)", "Coletar PNCP"]
    types: [completed]
    # Só a main. Uma coleta disparada à mão num ramo de teste mandaria e-mail de
    # verdade para cliente de verdade, com dado de um código que ninguém mesclou.
    branches: [main]
  schedule:
    # Reserva. 10:07 UTC = 07:07 em Brasília; minuto 7 para fugir da virada da
    # hora, que é o pico de atraso do agendador.
    - cron: "7 10 * * 1-5"
  workflow_dispatch:
    inputs:
      simular:
        description: "Não enviar nada — só imprimir o que sairia"
        type: boolean
        default: true

permissions:
  contents: read
  # Para baixar o artefato da coleta e saber quais praças ficaram de fora.
  actions: read

concurrency:
  # Duas execuções em paralelo mandariam o mesmo edital duas vezes: a checagem
  # de duplicidade lê o estado ANTES do envio. A unicidade de
  # `envios_do_resumo` pega na gravação, mas o e-mail já teria saído.
  #
  # Desde 24/09/2026 um disparo pode passar até 5h30 esperando as 7h, e segura
  # o grupo enquanto espera. Os outros disparos do dia — a segunda coleta, a
  # reserva — ficam na fila, e o GitHub mantém só o mais recente dela. Perder
  # um da fila não custa nada: todos são idempotentes, porque o plano manda um
  # resumo por empresa por dia e nunca o mesmo edital duas vezes.
  group: enviar-resumo-diario
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    # A espera até as 7h pode chegar a 5h30 (`ESPERA_MAXIMA_MS`), e um job do
    # GitHub vive no máximo 6 horas. 350 cobre a espera e o envio.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Sem isto o script morre no primeiro `import` de pacote. Ver
      # `workflows-instalam-dependencias.test.ts` e o defeito de 17/08.
      - name: Instalar dependências
        run: npm ci --omit=dev

      # Quem dispara à mão quer agora: o ensaio com `simular` às 3h da manhã não
      # pode ficar cinco horas esperando. A janela vale para os gatilhos
      # automáticos.
      - name: Decidir a hora do resumo
        id: janela
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          node scripts/decidir-janela-do-resumo.ts

          # Pular é resultado previsto, não falha: o job fica verde. Mas diz por
          # quê, na primeira tela da execução — um resumo que não saiu sem
          # explicação é o silêncio que `aviso-de-praca-le-a-coleta-certa.test.ts`
          # documenta.
          if [ "$(grep '^acao=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" = "pular" ]; then
            motivo=$(grep '^motivo=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
            echo "::notice title=Resumo não sai neste disparo::$motivo"
            {
              echo "## Resumo não sai neste disparo"
              echo
              echo "$motivo"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Esperar até as 7h de Brasília
        if: steps.janela.outputs.acao == 'esperar'
        run: |
          echo "a coleta terminou antes das 7h; esperando ${{ steps.janela.outputs.segundos }}s"
          sleep "${{ steps.janela.outputs.segundos }}"

      # As praças ausentes saem daqui. `continue-on-error` porque o resumo NÃO
      # depende disso: sem o arquivo, o e-mail sai sem a observação sobre praça
      # faltante — que é uma linha a menos, não um envio a menos.
      - name: Baixar a classificação da última coleta
        if: steps.janela.outputs.acao != 'pular'
        id: classificacao
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # `--status=completed` e NÃO `--status=success`, e a diferença é o
          # recurso inteiro.
          #
          # A coleta termina em "failure" sempre que UMA das 27 UFs cai, e o
          # PNCP derruba alguma quase todo dia: em 27/08 foram seis (AP, BA,
          # DF, GO, MA, SE) com erro 500 da fonte. Só que o job `juntar` roda
          # com `if: always()` e publica o `snapshot-pncp` do mesmo jeito.
          #
          # Filtrando por `success`, este passo pulava justamente as rodadas em
          # que houve praça faltante, e ia buscar a classificação da última
          # coleta perfeita — em 27/08, a de 24/08, com `ufsAusentes` vazio.
          # Ou seja: o aviso que existe para dizer ao cliente que a praça dele
          # ficou de fora só era lido nos dias em que nenhuma praça ficou de
          # fora. Ele nasceu inerte em 22/08 e ninguém tinha como notar, porque
          # o resumo sai igual e o campo vazio parece "não havia o que avisar".
          #
          # A presença do artefato é o critério certo, e o `for` abaixo já
          # confere isso. O status da rodada nunca foi a pergunta.
          candidatas=$(
            {
              gh run list --workflow=coletar-pncp-paralelo.yml --status=completed \
                --limit=10 --json databaseId,createdAt --jq '.[] | [.createdAt, .databaseId] | @tsv'
              gh run list --workflow=coletar-pncp.yml --status=completed \
                --limit=10 --json databaseId,createdAt --jq '.[] | [.createdAt, .databaseId] | @tsv'
            } | sort -r | cut -f2
          )

          for candidata in $candidatas; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidata/artifacts" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -qx snapshot-pncp; then
              gh run download "$candidata" --name snapshot-pncp --dir . || true
              break
            fi
          done

          arquivo=dados/parciais/classificacao.json
          codigo=0
          if [ -f "$arquivo" ]; then
            # `ufsAusentes` é o campo que `classificarColeta` grava desde 22/08.
            # Classificação antiga não tem o campo, e isso não é motivo para não
            # enviar o resumo — mas é motivo para avisar.
            ufs=$(node -p "((require('./$arquivo').ufsAusentes)||[]).join(',')") || codigo=$?
            echo "ufs=$ufs" >> "$GITHUB_OUTPUT"
            echo "praças fora da coleta: ${ufs:-nenhuma}"
          else
            codigo=1
            echo "ufs=" >> "$GITHUB_OUTPUT"
          fi

          # `continue-on-error` acima é correto: sem classificação o resumo sai
          # igual, só sem a observação de praça faltante. O que não pode é isso
          # sumir — se a classificação parar de chegar, o cliente deixa de ser
          # avisado sobre a praça dele e ninguém fica sabendo. Ver
          # `falha-silenciosa.test.ts`.
          if [ "$codigo" != "0" ]; then
            echo "::warning title=Resumo sem a observação de praça::não consegui ler ufsAusentes da última coleta — o e-mail sai sem avisar sobre praça faltante"
            {
              echo "## Resumo sai sem a observação de praça"
              echo
              echo "Não consegui ler \`ufsAusentes\` da última coleta. O envio continua; o que falta é a linha que avisa o cliente sobre a praça dele."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Encerrar os testes vencidos
        if: steps.janela.outputs.acao != 'pular'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          codigo=0
          node scripts/encerrar-testes.ts | tee saida-testes.txt || codigo=$?

          # ANTES do envio, e a ordem é a decisão: quem teve o teste encerrado
          # hoje não pode receber o e-mail de hoje. Encerrar depois de enviar
          # daria um dia a mais de produto a cada pessoa, todo dia, e mandaria
          # um e-mail prometendo um painel que ela já não consegue abrir.
          #
          # Falha aqui NÃO derruba o envio: um teste que sobrevive um dia a mais
          # custa um dia de produto; um envio derrubado custa o dia de todo
          # mundo que paga.
          if [ "$codigo" != "0" ]; then
            {
              echo "## ⚠️ Testes vencidos não foram encerrados"
              echo
              echo "Código \`$codigo\`. O envio seguiu. Quem venceu continua com acesso"
              echo "até a próxima execução."
              echo
              echo '```'
              tail -20 saida-testes.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Testes vencidos não encerrados::código $codigo"
          fi

      - name: Enviar
        if: steps.janela.outputs.acao != 'pular'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          # No agendamento é sempre envio de verdade; `simular` só existe para
          # quem dispara à mão. `inputs` vem vazio no schedule.
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular && '--simular' || '' }}
          UFS_AUSENTES: ${{ steps.classificacao.outputs.ufs }}
        run: |
          set -o pipefail

          # `--conditions=react-server` faz `server-only` resolver para o módulo
          # vazio; sem isso ele LANÇA na importação. Ver `scripts-resolvem.test.ts`.
          ausentes=""
          if [ -n "$UFS_AUSENTES" ]; then ausentes="--ufs-ausentes $UFS_AUSENTES"; fi

          codigo=0
          node --conditions=react-server scripts/enviar-resumo-diario.ts $SIMULAR $ausentes \
            | tee saida-resumo.txt || codigo=$?

          if [ "$codigo" = "78" ]; then
            {
              echo "## Resumo não enviado — faltam segredos"
              echo
              echo "O workflow rodou e parou de propósito. Nada foi enviado e nada finge ter saído."
              echo
              echo "Para ligar, crie em **Settings → Secrets and variables → Actions**:"
              echo
              echo '- `NEXT_PUBLIC_SUPABASE_URL`'
              echo '- `SUPABASE_SERVICE_ROLE_KEY`'
              echo '- `RESEND_API_KEY`'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Resumo inerte::faltam segredos — ver o resumo desta execução"
            exit 0
          fi

          {
            echo "## Resumo diário"
            echo
            echo '```'
            tail -25 saida-resumo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$codigo"

      - name: Publicar o log do envio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-resumo
          path: saida-resumo.txt
          retention-days: 30
          if-no-files-found: ignore
