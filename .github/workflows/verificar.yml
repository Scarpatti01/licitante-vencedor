name: Verificar

on:
  pull_request:
  push:
    branches: [main]

# Cancelar a execuÃ§Ã£o em andamento vale em PR, e NÃƒO vale na `main`.
#
# Num PR, trÃªs pushes seguidos sÃ£o trÃªs versÃµes do mesmo trabalho, e sÃ³ a Ãºltima
# responde Ã  pergunta: cancelar as anteriores economiza runner sem perder
# resposta nenhuma.
#
# Na `main` cada push Ã© um COMMIT DIFERENTE, e cada um precisa do prÃ³prio
# veredito â€” Ã© dela que a Vercel publica. Aconteceu em 26/08: a fila do Actions
# atrasou uns sete minutos e as duas execuÃ§Ãµes entraram fora de ordem. A do
# commit mais VELHO comeÃ§ou depois, caiu no mesmo grupo de concorrÃªncia e
# cancelou a do commit mais novo, que era o `head`. Sobrou uma `main` publicada
# com verificaÃ§Ã£o cancelada, e um check verde apontando para um commit que jÃ¡
# nÃ£o era o topo.
#
# O grupo continua por `github.ref`, que jÃ¡ separa um PR do outro. O que muda Ã©
