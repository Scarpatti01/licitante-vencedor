      # `npm ci` inteiro, e nÃ£o `--omit=dev`: aqui o que se quer Ã© justamente o
      # que os workflows de coleta dispensam â€” vitest, eslint, typescript e o
      # prÃ³prio next para o build.
      - run: npm ci

      - name: Tipos
        run: npm run tipos

      - name: Lint
        run: npx eslint .

      - name: Testes
        run: npm test

      # O EPUB Ã© gerado aqui porque ele NÃƒO precisa de navegador, e porque a
      # fonte do livro Ã© editada como qualquer outro arquivo do repositÃ³rio.
      #
      # Existe por um defeito real: trocar o selo da capa de "Rascunho completo"
      # para "Primeira ediÃ§Ã£o" introduziu a entidade `&atilde;`, o PDF foi
      # regerado e o EPUB nÃ£o. A publicaÃ§Ã£o para o balde sÃ³ reprovou depois do
      # merge, com o produto jÃ¡ prometido na home. Quinze segundos de CI evitam
      # isso, e `conferir-epub.py` ainda mede links, seÃ§Ãµes e texto faltando.
      - name: O livro continua gerando
        run: |
          cd livro
          python3 gerar-epub.py
          python3 conferir-epub.py

      # O build entra porque trÃªs defeitos desta base sÃ³ apareceram nele:
      # `import.meta.glob` que o Turbopack nÃ£o tem, `Date.now()` impuro durante
      # a renderizaÃ§Ã£o, e `generateStaticParams` exigindo leitura sÃ­ncrona.
      # Nenhum deles falha em teste unitÃ¡rio.
      - name: Build
        run: npm run build

      - name: Instalar navegador para validação móvel
        run: npx playwright install --with-deps chromium

      - name: Validar navegação móvel
        run: npm run test:mobile

      - name: Guardar evidências da validação móvel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-mobile
