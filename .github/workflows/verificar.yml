# A verificação que faltava.
#
# O repositório tem 760 testes e nenhum deles reprovava um PR: rodavam só quando
# alguém lembrava de rodar na máquina. Isso vale para todos, mas é mais grave
# aqui do que num projeto comum, porque boa parte desta suíte não testa função —
# testa DECISÃO.
#
# Alguns exemplos do que estava desprotegido:
#
#   · `coleta-paralela.test.ts` — impede que os dois workflows de coleta ganhem
#     agendamento ao mesmo tempo, o que comitaria o agregado duas vezes no mesmo
#     dia com resultados diferentes;
#   · `publicacao-no-workflow.test.ts` — exige que o runner instale as
#     dependências, e que a leva sem nenhuma leitura seja recusada;
#   · a guarda de degradação — "um dia ruim não apaga um dia bom", regra que
#     custou uma série temporal para ser aprendida.
#
# Cada um desses testes existe porque a decisão que ele guarda é fácil de
# desfazer sem perceber. Sem CI, a mensagem de falha que eles carregam só é lida
# por quem já estava desconfiado — que é justamente quem não precisa dela.
#
# Roda em PR e em push para `main`. O push importa: a coleta diária comita
# direto na main, e uma mudança de dado que quebrasse o build precisa aparecer
# antes de a Vercel publicar.

name: Verificar

on:
  pull_request:
  push:
    branches: [main]

# Cancelar a execução em andamento vale em PR, e NÃO vale na `main`.
#
# Num PR, três pushes seguidos são três versões do mesmo trabalho, e só a última
# responde à pergunta: cancelar as anteriores economiza runner sem perder
# resposta nenhuma.
#
# Na `main` cada push é um COMMIT DIFERENTE, e cada um precisa do próprio
# veredito — é dela que a Vercel publica. Aconteceu em 26/08: a fila do Actions
# atrasou uns sete minutos e as duas execuções entraram fora de ordem. A do
# commit mais VELHO começou depois, caiu no mesmo grupo de concorrência e
# cancelou a do commit mais novo, que era o `head`. Sobrou uma `main` publicada
# com verificação cancelada, e um check verde apontando para um commit que já
# não era o topo.
#
# O grupo continua por `github.ref`, que já separa um PR do outro. O que muda é
# só quem pode ser cancelado.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # `npm ci` inteiro, e não `--omit=dev`: aqui o que se quer é justamente o
      # que os workflows de coleta dispensam — vitest, eslint, typescript e o
      # próprio next para o build.
      - run: npm ci

      - name: Tipos
        run: npm run tipos

      - name: Lint
        run: npx eslint .

      - name: Testes
        run: npm test

      # O EPUB é gerado aqui porque ele NÃO precisa de navegador, e porque a
      # fonte do livro é editada como qualquer outro arquivo do repositório.
      #
      # Existe por um defeito real: trocar o selo da capa de "Rascunho completo"
      # para "Primeira edição" introduziu a entidade `&atilde;`, o PDF foi
      # regerado e o EPUB não. A publicação para o balde só reprovou depois do
      # merge, com o produto já prometido na home. Quinze segundos de CI evitam
      # isso, e `conferir-epub.py` ainda mede links, seções e texto faltando.
      - name: O livro continua gerando
        run: |
          cd livro
          python3 gerar-epub.py
          python3 conferir-epub.py

      # O build entra porque três defeitos desta base só apareceram nele:
      # `import.meta.glob` que o Turbopack não tem, `Date.now()` impuro durante
      # a renderização, e `generateStaticParams` exigindo leitura síncrona.
      # Nenhum deles falha em teste unitário.
      - name: Build
        run: npm run build
