# Envio diário do alerta gratuito.
#
# Roda SEPARADO da coleta, e não como um passo dela, por uma razão de produto: o
# e-mail de boas-vindas promete que o alerta chega "nos dias úteis, pela manhã".
# A coleta roda às 03:10 de Brasília — cedo o bastante para não bater no pico do
# PNCP e cedo demais para ser manhã de alguém. Colar o envio nela entregaria o
# e-mail com carimbo de 3 da madrugada, e a promessa não é sobre quando o
# processo roda, é sobre quando a mensagem chega.
#
# Também não recoleta. Ele baixa o snapshot que a coleta já produziu, pelos dois
# motivos que o próprio script explica: dobrar a carga contra um serviço público
# que já responde 429 no limite, e — pior — afirmar no e-mail coisas que o site
# não mostra.
#
# ## O que acontece quando a coleta falhou
#
# Nada, e de propósito. Sem execução bem-sucedida recente não há artefato para
# baixar, e o passo falha alto. Além disso o script recusa snapshot com mais de
# 36 horas. O modo de falha que isso evita não faz barulho: com dado velho o
# alerta continua saindo, só que sem os editais publicados desde então — e o
# e-mail que chega parece perfeitamente normal.
#
# ## E o que acontece enquanto os segredos não existem
#
# O job termina VERDE, com um resumo dizendo o que falta. Não é indulgência: é
# a diferença entre "algo deu errado" e "algo ainda não foi feito". Este
# workflow roda todo dia útil, e falhar sempre pelo mesmo motivo conhecido
# ensinaria a ignorar o X vermelho — e é aí que a falha de verdade passa a se
# esconder no meio das outras. O script devolve 78 (`EX_CONFIG`) para esse
# caso, e só para ele; qualquer outra falha continua gritando.

name: Enviar alertas

on:
  schedule:
    # 10:10 UTC = 07:10 em Brasília, de segunda a sexta. O alerta está na caixa
    # antes do começo do expediente, que é o que as boas-vindas prometem.
    #
    # Dia útil é decidido AQUI, e não dentro do script: dois lugares para a
    # mesma regra é o caminho clássico para alguém mudar o cron e o produto
    # continuar mandando no sábado.
    - cron: "10 10 * * 1-5"
  workflow_dispatch:
    inputs:
      simular:
        description: "Não enviar nada — só imprimir o que sairia"
        type: boolean
        default: true

permissions:
  contents: read
  # Para baixar o artefato da execução da coleta.
  actions: read

concurrency:
  # Duas execuções em paralelo mandariam o mesmo edital duas vezes: a checagem
  # de duplicidade lê o estado ANTES do envio, e as duas leriam o mesmo estado.
  # A restrição de unicidade no banco pega isso na hora de gravar, mas o e-mail
  # já teria saído. Aqui a segunda execução simplesmente não começa.
  group: enviar-alertas
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Sem isto o alerta não roda. NENHUMA vez.
      #
      # Descoberto em 17/08, na primeira execução disparada à mão depois de o
      # produto ganhar um perfil de empresa real: o job morreu em 11 segundos
      # com `Cannot find package 'server-only' imported from
      # src/lib/email/resend.ts`. Repare que NÃO é o `server-only` lançando de
      # propósito, que é o defeito que `--conditions=react-server` resolve lá
      # embaixo — é o pacote não existir, porque `node_modules` nunca foi criado
      # neste runner. Dois defeitos parecidos no mesmo import, e o segundo
      # estava escondido atrás do primeiro.
      #
      # É a mesma causa que apagou a leitura dos 25 editais em 16/08 e que a
      # PR #21 corrigiu — em `coletar-pncp.yml`. A correção não foi
      # generalizada, e este workflow ficou para trás por um mês.
      # `workflows-instalam-dependencias.test.ts` passa a cobrar de TODOS, e não
      # do próximo que alguém lembrar.
      - name: Instalar dependências
        run: npm ci --omit=dev

      # A execução mais recente que TEM O ARTEFATO — não a mais recente que ficou
      # verde. A diferença derrubou o primeiro alerta da história do projeto.
      #
      # `coletar-pncp.yml` tem duas rodadas por dia. A das 08:10 é a segunda
      # tentativa e, quando a das 06:10 já publicou, ela decide não coletar e
      # termina em ~18 segundos: verde, correta, e sem snapshot nenhum. Como era
      # a mais recente com `--status=success`, era ela que o `--limit=1` pegava —
      # e o download morria com "no valid artifacts found", todo dia útil.
      #
      # O próprio `coletar-pncp.yml` já tinha aprendido esta lição, do outro
      # lado: ele recusa perguntar à API se já coletou hoje, porque
      # "`conclusion == success` diz que o job terminou verde", que é a pergunta
      # errada. Aqui a pergunta certa é "esta execução produziu o snapshot?" — e
      # só a lista de artefatos responde isso.
      #
      # Olhar 10 candidatas em vez de 1 não afrouxa nada: `enviar-alertas.ts`
      # recusa snapshot com mais de 36 horas, então uma coleta velha com artefato
      # continua sendo rejeitada — pelo motivo certo, e com a mensagem certa.
      - name: Baixar o snapshot da última coleta que produziu snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Procura nas DUAS coletas, da mais recente para a mais antiga.
          #
          # Olhava só `coletar-pncp.yml`, e isso quebrou sem fazer barulho: em
          # 21/08 a coleta diária passou a ser a paralela, a sequencial perdeu o
          # cron, e o alerta ficou preso ao artefato de um workflow que não roda
          # mais. Sobreviveu dois dias pelo limite de 36 horas do script e
          # pararia na segunda-feira — sem nada ter "quebrado" naquele dia.
          #
          # Perguntar às duas, em vez de trocar uma pela outra, é o que mantém
          # isto funcionando nos dois sentidos: o cabeçalho de `coletar-pncp.yml`
          # diz que voltar para a sequencial é mover os `cron` de volta, e essa
          # volta não pode exigir que alguém lembre de editar este arquivo
          # também.
          id=""
          candidatas=$(
            {
              gh run list --workflow=coletar-pncp-paralelo.yml --status=success \
                --limit=10 --json databaseId,createdAt --jq '.[] | [.createdAt, .databaseId] | @tsv'
              gh run list --workflow=coletar-pncp.yml --status=success \
                --limit=10 --json databaseId,createdAt --jq '.[] | [.createdAt, .databaseId] | @tsv'
            } | sort -r | cut -f2
          )

          for candidata in $candidatas; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidata/artifacts" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -qx snapshot-pncp; then
              id="$candidata"
              break
            fi
            echo "execução $candidata terminou verde sem snapshot — provavelmente a segunda tentativa do dia, que decide não coletar"
          done

          if [ -z "$id" ]; then
            echo "::error title=Sem coleta::nenhuma execução recente de coletar-pncp-paralelo.yml nem de coletar-pncp.yml produziu o artefato snapshot-pncp"
            exit 1
          fi

          echo "baixando o snapshot da execução $id"
          gh run download "$id" --name snapshot-pncp --dir .
          ls -la dados/editais.json

      - name: Enviar
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          # No agendamento é sempre envio de verdade; o `simular` só existe para
          # quem dispara à mão. `github.event.inputs` vem vazio no schedule.
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular && '--simular' || '' }}
        run: |
          set -o pipefail

          # `--conditions=react-server` faz o pacote `server-only` resolver para
          # o módulo vazio. Sem isso ele LANÇA na importação: a condição
          # `default` do pacote é um `throw`, e quem a recebe é justamente um
          # processo Node como este.
          #
          # `|| codigo=$?` em vez de deixar o `set -e` matar: o código de saída é
          # informação aqui, não só sucesso ou fracasso.
          codigo=0
          node --conditions=react-server scripts/enviar-alertas.ts $SIMULAR | tee saida-alertas.txt || codigo=$?

          if [ "$codigo" = "78" ]; then
            # 78 é `EX_CONFIG`: faltam segredos. Encerra LIMPO, dizendo o que
            # falta — ver o comentário do `SEM_CONFIGURACAO` no script para o
            # porquê. Em resumo: este job roda todo dia útil, e falhar sempre
            # pelo mesmo motivo conhecido ensina a ignorar o X vermelho, que é
            # onde a falha de verdade passa a se esconder.
            {
              echo "## Alerta não enviado — faltam segredos"
              echo
              echo "O workflow rodou e parou de propósito. Nada foi enviado e nada finge ter saído."
              echo
              echo "Para ligar, crie em **Settings → Secrets and variables → Actions**:"
              echo
              echo '- `NEXT_PUBLIC_SUPABASE_URL`'
              echo '- `SUPABASE_SERVICE_ROLE_KEY`'
              echo '- `RESEND_API_KEY`'
              echo
              echo "Depois rode este workflow à mão com **simular** marcado para conferir a saída antes do primeiro envio real."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Alerta inerte::faltam segredos — ver o resumo desta execução"
            exit 0
          fi

          # Qualquer outro código diferente de zero é falha de verdade: o
          # provedor recusou, o banco não respondeu, o snapshot estava velho.
          # Essa falha PRECISA gritar.
          exit "$codigo"

      - name: Publicar o log do envio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-alertas
          path: saida-alertas.txt
          retention-days: 30
          if-no-files-found: ignore
