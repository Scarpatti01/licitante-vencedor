# Coleta paralela do PNCP — uma UF por job.
#
# ⚠️ ESTE É O WORKFLOW QUE COLETA TODO DIA, desde 18/08.
#
# Nasceu desligado de propósito, esperando a coleta sequencial confirmar numa
# rodada real que a publicação de posts estava saindo certa — duas cirurgias na
# mesma véspera, no workflow do qual dependem o alerta, o produto e os posts,
# tornariam impossível saber qual das duas quebrou. Essa confirmação veio, e a
# promoção foi o que o cabeçalho antigo já descrevia: mover os dois `cron` para
# cá e desligar o agendamento de lá. Nada mais mudou.
#
# `coletar-pncp.yml` continua existindo, disparável à mão. Voltar atrás é mover
# os dois `cron` de volta.
#
# ## Por que paralelizar
#
# Medido contra o PNCP em 2026-08-15, consultando `totalRegistros` das 27 UFs:
#
#   6 UFs piloto ....... 3.445 editais /  71 páginas
#   Brasil inteiro .... 28.912 editais / 592 páginas   (8,4x)
#
# Em série, o Brasil leva 33 min num dia rápido e ~117 num dia normal — contra um
# teto de 45 min no job. NÃO CABE. Em 27 jobs simultâneos, o tempo total é o do
# estado mais lento: SP, com 109 páginas.
#
# Em repositório público os minutos de Actions são gratuitos, então o custo em
# dinheiro disto é zero.
#
# ## O ganho que não é de tempo
#
# Hoje o PNCP cair no meio derruba a coleta inteira — aconteceu em 12/08 e em
# 14/08. Com um job por UF, ele cair derruba UM estado, e os outros 26 publicam.
# É o isolamento por UF que o script já faz internamente, levado até o runner.

name: Coletar PNCP (paralelo)

on:
  schedule:
    # 06:10 UTC = 03:10 em Brasília. Cedo o bastante para o alerta das 7h e
    # fora do horário de pico do PNCP.
    - cron: "10 6 * * *"
    # 08:10 UTC = 05:10 em Brasília. SEGUNDA TENTATIVA, e ela quase sempre não
    # faz nada.
    #
    # Existe porque uma tentativa por dia se mostrou pouco contra esta fonte: o
    # PNCP caiu duas vezes em 12/08, entregou 13/08 já degradado (PE parcial por
    # timeout, PB zerado) e falhou por inteiro em 14/08. E o dia perdido não se
    # recolhe — a janela desta coleta é "propostas abertas HOJE", então o edital
    # que encerrou no intervalo saiu do alcance para sempre.
    #
    # 08:10, e não mais tarde, porque o envio de alertas é 10:10: a segunda
    # tentativa tem de caber inteira antes dele.
    - cron: "10 8 * * *"
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs, separadas por vírgula. Vazio = as 27."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # O MESMO grupo do workflow sequencial. Os dois nunca podem coletar ao mesmo
  # tempo: o upsert no banco aguenta, mas o commit do agregado não — um
  # sobrescreveria o outro sem que ninguém visse.
  group: coletar-pncp
  cancel-in-progress: false

jobs:
  # Decide a lista de UFs uma vez, para a matriz e o resumo concordarem.
  planejar:
    runs-on: ubuntu-latest
    outputs:
      ufs: ${{ steps.lista.outputs.ufs }}
    steps:
      - id: lista
        env:
          PEDIDAS: ${{ inputs.ufs }}
        run: |
          set -euo pipefail
          if [ -n "$PEDIDAS" ]; then
            lista=$(echo "$PEDIDAS" | tr ',' '\n' | sed 's/ //g' | grep . | jq -R . | jq -cs .)
          else
            lista='["AC","AL","AM","AP","BA","CE","DF","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"]'
          fi
          echo "ufs=$lista" >> "$GITHUB_OUTPUT"
          echo "coletando: $lista"

  coletar:
    needs: planejar
    runs-on: ubuntu-latest
    # Um estado sozinho é muito menor que a coleta inteira: SP, o maior, tem 109
    # páginas. 20 min dá folga larga mesmo num dia ruim.
    timeout-minutes: 20
    strategy:
      # `fail-fast: false` é o coração do desenho. Com ele ligado, uma UF que
      # falha cancelaria as outras 26 — reintroduzindo, na camada do runner,
      # exatamente o modo de falha que paralelizar veio eliminar.
      fail-fast: false
      max-parallel: 10
      matrix:
        uf: ${{ fromJSON(needs.planejar.outputs.ufs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # O shard só coleta, e a coleta usa apenas o `fetch` embutido. Instala
      # mesmo assim: o dia em que alguém importar um pacote aqui, o erro seria o
      # mesmo que apagou a leitura dos posts em 16/08 — falha por item, capturada,
      # com o job verde.
      - name: Instalar dependências
        run: npm ci --omit=dev

      # `--parcial`: coleta, grava no banco e PARA antes de agregar. Quem agrega
      # é o job `juntar`, com os editais de todas as UFs na mão — a auditoria de
      # valores suspeitos compara editais entre si, e por UF ela perderia sentido.
      - name: Coletar ${{ matrix.uf }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          mkdir -p shards
          node scripts/ingerir-pncp.ts \
            --uf "${{ matrix.uf }}" \
            --dias 90 \
            --orcamento-min 15 \
            --parcial \
            --saida "shards/editais-${{ matrix.uf }}.json"

      - name: Guardar o parcial de ${{ matrix.uf }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.uf }}
          path: shards/
          retention-days: 3
          if-no-files-found: ignore

  juntar:
    needs: [planejar, coletar]
    # `always()` porque a junção precisa rodar mesmo com UFs falhando — juntar 24
    # de 27 é o resultado certo de um dia em que o PNCP oscilou, e recusar isso
    # jogaria fora uma coleta boa por causa de três estados.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Aqui é obrigatório, não precaução: é este job que publica os posts, e
      # `publicar-posts.ts` importa `pdfjs-dist` e `@google/genai`.
      - name: Instalar dependências
        run: npm ci --omit=dev

      - name: Baixar os parciais
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: shards

      # As credenciais aqui são para `execucoes_de_coleta` (o veredito da
      # rodada, que `painelDoDia` lê) — a junção em si não toca no banco.
      - name: Juntar num agregado só
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/juntar-coleta.ts --parciais shards | tee saida-juncao.txt

      - name: Ler a classificação
        id: classe
        run: |
          arquivo=dados/parciais/classificacao.json
          if [ ! -f "$arquivo" ]; then
            echo "classe=ausente" >> "$GITHUB_OUTPUT"
            echo "motivos=a junção não chegou a classificar o resultado" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `replace(/[\r\n]+/g, ' ')` pela mesma razão do workflow sequencial:
          # `motivos` carrega siglas vindas do PNCP, e uma quebra de linha aí
          # encerraria a linha do $GITHUB_OUTPUT e deixaria o resto virar outra
          # saída — inclusive um `classe=completa` forjado.
          classe=$(node -p "String(require('./$arquivo').classe).replace(/[\r\n]+/g, ' ')")
          motivos=$(node -p "String(require('./$arquivo').motivos.join(' | ')).replace(/[\r\n]+/g, ' ')")
          echo "classe=$classe" >> "$GITHUB_OUTPUT"
          echo "motivos=$motivos" >> "$GITHUB_OUTPUT"
          echo "coleta classificada como: $classe"

      # `--conditions=react-server` porque a cadeia da análise passa por
      # `ia/gemini.ts`, que importa `server-only` — um pacote cuja única função
      # é LANÇAR quando resolvido fora do servidor. Sem a flag, a importação
      # falha nos 25 editais, um a um, e o job termina verde: foi assim que a
      # leva de 17/08 saiu com `com leitura: 0 de 25`.
      #
      # `enviar-alertas.yml` já fazia isso e explicava o porquê. O que faltava
      # era alguém cobrar — agora `scripts-resolvem.test.ts` cobra, descobrindo
      # sozinho quais scripts alcançam `server-only`.
      - name: Publicar a leva de posts do dia
        if: steps.classe.outputs.classe == 'completa' || steps.classe.outputs.classe == 'parcial-aceitavel'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          node --conditions=react-server scripts/publicar-posts.ts | tee saida-posts.txt

      # Mesma cadência de `coletar-pncp.yml`: logo depois de os editais estarem
      # no banco, e sem a guarda de `classe` — a triagem lê o que existe agora em
      # `editais`, não o snapshot desta rodada, e um upsert de dia ruim não
      # desfaz o que dias bons já gravaram. `continue-on-error` pelo mesmo
      # motivo do passo anterior: nem o post nem a triagem podem custar o
      # commit do agregado.
      - name: Triar editais por perfil
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/triar-editais.ts | tee saida-triagem.txt

      # Logo depois da triagem, mesma cadência: precisa do score "de ficha" do
      # dia já gravado para saber quem é candidato a leitura (score ≥ 70 — ver
      # o cabeçalho de `ler-recomendados.ts`). `--conditions=react-server`
      # pela mesma razão de "Publicar a leva de posts do dia" — a cadeia da
      # análise passa por `ia/gemini.ts`. `continue-on-error`, mesmo motivo dos
      # vizinhos.
      - name: Ler os editais mais recomendados
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          node --conditions=react-server scripts/ler-recomendados.ts | tee saida-leitura.txt

      # `${{ }}` NUNCA entra no corpo de um `run:`, pela mesma regra do workflow
      # sequencial: a expressão é substituída no TEXTO do programa antes de o
      # shell existir, e `motivos` deriva de dado do PNCP.
      - name: Versionar agregado, revisão e posts
        if: steps.classe.outputs.classe == 'completa' || steps.classe.outputs.classe == 'parcial-aceitavel'
        env:
          CLASSE: ${{ steps.classe.outputs.classe }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dados/agregados.json dados/revisao.md dados/posts/
          if git diff --cached --quiet; then
            echo "nada mudou, nada a commitar"
            exit 0
          fi
          git commit -m "Coleta do PNCP de $(date -u +%Y-%m-%d) ($CLASSE)"
          git push

      - name: Avisar que a coleta foi recusada
        if: steps.classe.outputs.classe != 'completa' && steps.classe.outputs.classe != 'parcial-aceitavel'
        env:
          CLASSE: ${{ steps.classe.outputs.classe }}
          MOTIVOS: ${{ steps.classe.outputs.motivos }}
        run: |
          {
            echo "## Coleta recusada — o agregado anterior foi preservado"
            echo
            echo "Classificação: \`$CLASSE\`"
            echo
            echo "Motivos: $MOTIVOS"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Coleta paralela do PNCP recusada::$MOTIVOS"
          exit 1
