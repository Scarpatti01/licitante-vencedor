# Coleta diária de editais.
#
# Roda a ingestão, passa pelo revisor e versiona apenas o agregado por município
# e o relatório de revisão. O snapshot completo (~3,6 MB por coleta, só das 6 UFs
# piloto) sai como artefato da execução, não como commit: diário, ele engordaria
# o repositório em gigabytes por ano.
#
# O commit do agregado é, de propósito, a série temporal do projeto — é dele que
# sai o "valor licitado nos últimos 12 meses" da página regional, sem banco.
#
# O PNCP cai. Isso não é hipótese: em 2026-08-12 ele saiu do ar duas vezes em
# poucas horas, e em 2026-08-13 a coleta inteira foi interrompida no meio. Por
# isso a coleta é isolada por UF, tem orçamento de tempo, e — a parte que
# faltava — o resultado é CLASSIFICADO antes de virar commit.
#
# A regra que este workflow passou a obedecer: um dia ruim não apaga um dia bom.
# Antes, ele só verificava "o arquivo existe e mudou", e uma coleta de 150
# editais em 2 UFs sobrescreveu, sem um aviso, a de 3.312 editais em 6 UFs do
# dia anterior. Série temporal perdida não se recoleta: a janela é "propostas
# abertas HOJE".
#
# E, pela mesma razão, um dia ruim também não pode custar o dia inteiro: há uma
# SEGUNDA TENTATIVA às 08:10 UTC que só coleta se a primeira não tiver publicado.
# Ela não consulta a API do GitHub para descobrir isso — lê o `coletadoEm` do
# agregado que veio no checkout, que responde a pergunta certa e não custa
# permissão nova nem confiança em nada externo. O porquê está no passo "Decidir
# se esta rodada precisa coletar".

name: Coletar PNCP

on:
  schedule:
    # 06:10 UTC = 03:10 em Brasília. Cedo o bastante para o alerta das 7h e
    # fora do horário de pico do PNCP.
    - cron: "10 6 * * *"
    # 08:10 UTC = 05:10 em Brasília. SEGUNDA TENTATIVA, e ela quase sempre não
    # faz nada — ver o passo "Decidir se esta rodada precisa coletar".
    #
    # Existe porque uma tentativa por dia se mostrou pouco contra esta fonte: o
    # PNCP caiu duas vezes em 12/08, entregou 13/08 já degradado (PE parcial por
    # timeout, PB zerado) e falhou por inteiro em 14/08. E o dia perdido não se
    # recolhe — a janela desta coleta é "propostas abertas HOJE", então o edital
    # que encerrou no intervalo saiu do alcance para sempre.
    #
    # 08:10, e não mais tarde, porque o envio de alertas é 10:10: a segunda
    # tentativa tem de caber inteira antes dele.
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar-pncp
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # 45 min aqui contra 30 de orçamento no script (`--orcamento-min`). A folga
    # é deliberada: o run de 2026-08-13 levou ~43 min e quase morreu no teto —
    # e morrendo no teto ele não grava NADA, nem o que já havia coletado. Com
    # orçamento no script, a coleta lenta termina sozinha, declara cobertura
    # parcial e ainda tem tempo de gravar, classificar e commitar.
    timeout-minutes: 45

    steps:
      # O agregado do dia anterior vem do próprio checkout: é ele que a guarda
      # de degradação usa como referência. Nada de estado fora do git.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # A segunda tentativa do dia só coleta se a primeira não publicou.
      #
      # A pergunta é respondida pelo `coletadoEm` de `dados/agregados.json`, que
      # veio no checkout — e NÃO pela API do GitHub, que seria o caminho óbvio.
      # Duas razões, e a segunda é a que decidiu:
      #
      #   1. Zero superfície de confiança e zero permissão nova. Não precisa de
      #      token, de `actions: read` nem de chamada externa: é o nosso arquivo,
      #      escrito pelo nosso coletor, chegando pelo git.
      #
      #   2. A API responderia a pergunta ERRADA. `conclusion == "success"` diz
      #      que o job terminou verde, e este workflow termina verde recusando a
      #      coleta quando ela vem degradada. O agregado, por outro lado, só é
      #      commitado quando a classificação é `completa` ou `parcial-aceitavel`
      #      — então "coletadoEm é de hoje" significa exatamente "já temos coleta
      #      boa hoje", que é a condição que decide se vale insistir.
      #
      # Qualquer coisa fora do esperado (arquivo ausente, data ilegível) resolve
      # para COLETAR. O custo de errar para esse lado é uma coleta redundante; o
      # de errar para o outro é um dia de editais perdido.
      - name: Decidir se esta rodada precisa coletar
        id: decidir
        env:
          # Por `env:` e não interpolado no script, pela regra que este arquivo
          # já segue mais abaixo: `${{ }}` dentro de `run:` é substituído no
          # TEXTO do programa antes de o shell existir.
          AGENDAMENTO: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ "$AGENDAMENTO" != "10 8 * * *" ]; then
            echo "pular=false" >> "$GITHUB_OUTPUT"
            echo "rodada principal (ou disparo manual) — coletando"
            exit 0
          fi

          arquivo=dados/agregados.json
          if [ ! -f "$arquivo" ]; then
            echo "pular=false" >> "$GITHUB_OUTPUT"
            echo "sem $arquivo — coletando"
            exit 0
          fi

          # `[0-9]` em vez de `\d` para não ter barra invertida atravessando YAML
          # e shell. Data que não casar com o formato vira 'invalido' e cai no
          # ramo que coleta.
          coletado=$(node -p "
            const v = String(require('./$arquivo').coletadoEm ?? '').slice(0, 10);
            /^[0-9]{4}-[0-9]{2}-[0-9]{2}\$/.test(v) ? v : 'invalido';
          ")
          hoje=$(date -u +%F)

          if [ "$coletado" = "$hoje" ]; then
            echo "pular=true" >> "$GITHUB_OUTPUT"
            echo "a coleta das 06:10 já publicou hoje ($coletado) — nada a fazer"
          else
            echo "pular=false" >> "$GITHUB_OUTPUT"
            echo "último agregado é de $coletado, e hoje é $hoje — repetindo a coleta"
          fi

      - name: Coletar e revisar
        id: coleta
        if: steps.decidir.outputs.pular != 'true'
        run: |
          set -o pipefail
          node scripts/ingerir-pncp.ts \
            --dias 90 \
            --orcamento-min 30 \
            --saida dados/editais.json | tee saida-coleta.txt

      # Sai sempre, inclusive quando a coleta falha: é o material de diagnóstico
      # do dia em que o PNCP esteve fora. `dados/parciais/` carrega o agregado
      # recusado — ele não some, só não vira a série oficial.
      - name: Publicar snapshot e parciais como artefato
        # `always()` para sair mesmo quando a coleta falha — é o diagnóstico do
        # dia ruim. Combinado com a guarda: rodada que nem coletou não tem o que
        # publicar, e um artefato vazio confundiria quem for procurar o do dia.
        if: always() && steps.decidir.outputs.pular != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-pncp
          path: |
            dados/editais.json
            dados/parciais/
            saida-coleta.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Ler a classificação da coleta
        id: classe
        if: steps.decidir.outputs.pular != 'true'
        run: |
          arquivo=dados/parciais/classificacao.json
          if [ ! -f "$arquivo" ]; then
            echo "classe=ausente" >> "$GITHUB_OUTPUT"
            echo "motivos=a coleta não chegou a classificar o resultado" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `node -p` e não `jq`: o repositório já exige node, e uma dependência
          # a menos no runner é uma forma a menos de o cron quebrar sozinho.
          #
          # As duas leituras passam por `replace(/[\r\n]+/g, ' ')` porque o
          # conteúdo NÃO é nosso: `motivos` inclui siglas de UF que vieram do
          # PNCP (`unidadeOrgao.ufSigla`, sem validação de formato em nenhuma
          # camada) e chegam aqui via `dados/agregados.json`. Uma quebra de linha
          # nesse texto encerra a linha `chave=valor` do $GITHUB_OUTPUT e deixa o
          # resto virar OUTRA saída — inclusive um `classe=completa` forjado, que
          # faria o passo de commit aceitar uma coleta degradada.
          classe=$(node -p "String(require('./$arquivo').classe).replace(/[\r\n]+/g, ' ')")
          motivos=$(node -p "String(require('./$arquivo').motivos.join(' | ')).replace(/[\r\n]+/g, ' ')")
          echo "classe=$classe" >> "$GITHUB_OUTPUT"
          echo "motivos=$motivos" >> "$GITHUB_OUTPUT"
          echo "coleta classificada como: $classe"

      # `${{ }}` NUNCA entra no corpo de um `run:` aqui: a expressão é
      # substituída no texto do script ANTES de o shell rodar, então um valor
      # com aspa ou `$(...)` viraria comando executado no runner — que carrega
      # um GITHUB_TOKEN com `contents: write`. O valor chega por `env:`, onde é
      # variável de ambiente e não texto de programa. Vale para `classe` e
      # `motivos`, os dois derivados de dado do PNCP.
      - name: Versionar agregado e revisão
        if: steps.decidir.outputs.pular != 'true' && (steps.classe.outputs.classe == 'completa' || steps.classe.outputs.classe == 'parcial-aceitavel')
        env:
          CLASSE: ${{ steps.classe.outputs.classe }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dados/agregados.json dados/revisao.md
          if git diff --cached --quiet; then
            echo "agregado idêntico ao do dia anterior, nada a commitar"
            exit 0
          fi
          git commit -m "Coleta do PNCP de $(date -u +%Y-%m-%d) ($CLASSE)"
          git push

      # Coleta degradada NÃO commita — e também não passa em silêncio, que era
      # metade do defeito. A falha do job é o mecanismo de aviso de propósito:
      # é a única coisa que o GitHub notifica sozinho num cron. Um `::warning`
      # ficaria enterrado no log de uma execução que ninguém abre, e o produto
      # seguiria dias servindo o agregado velho sem que alguém soubesse.
      - name: Avisar que a coleta foi recusada
        # A guarda de `pular` vem PRIMEIRO e não é redundante: numa rodada que
        # não coletou, `classe` é string vazia, `!= 'completa'` é verdadeiro, e
        # sem esta condição o job falharia todo dia às 08:10 anunciando uma
        # recusa que nunca aconteceu.
        if: steps.decidir.outputs.pular != 'true' && steps.classe.outputs.classe != 'completa' && steps.classe.outputs.classe != 'parcial-aceitavel'
        env:
          CLASSE: ${{ steps.classe.outputs.classe }}
          MOTIVOS: ${{ steps.classe.outputs.motivos }}
        run: |
          {
            echo "## Coleta recusada — o agregado anterior foi preservado"
            echo
            echo "Classificação: \`$CLASSE\`"
            echo
            echo "Motivos: $MOTIVOS"
            echo
            echo "O resultado desta rodada está no artefato \`snapshot-pncp\`, em \`dados/parciais/\`."
            echo "Nada foi commitado: \`dados/agregados.json\` continua sendo o último agregado bom."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Coleta do PNCP recusada::$MOTIVOS"
          exit 1
