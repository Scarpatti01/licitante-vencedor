# Lê os editais recomendados pela Batch API do Gemini (`scripts/ler-em-lote.ts`).
#
# AGENDADO desde 25/08, depois de quatro ensaios reais. Ficou desligado até
# então porque o formato REST do lote nunca tinha sido exercitado contra a API
# de verdade — e os quatro ensaios provaram que essa cautela valia: cada um
# derrubou um degrau que nenhum teste nosso pegaria (o dialeto do estado, o
# lugar das respostas, o enum do custo).
#
# 03:00 UTC é meia-noite em Brasília, e é ANTES da coleta das 06:10 de
# propósito: quando a leitura avulsa da coleta rodar, encontra o cache já
# quente e só lê o que o lote não conseguiu.
#
# Rodar isto NÃO desliga a leitura avulsa, e não é para desligar. Os dois
# convivem: o lote pega a maioria pela metade do preço, e o que ele deixa
# passar — edital sem evidência suficiente, lote recusado, prazo estourado —
# continua caindo na avulsa, que sabe escalar de modelo. Trocar um pelo outro
# tornaria toda falha do lote uma leitura perdida.

name: Ler editais em lote

on:
  schedule:
    # 03:00 UTC = meia-noite em Brasília, três horas antes da coleta.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Montar os pedidos e NÃO mandar nada ao fornecedor"
        type: boolean
        default: true
      limite:
        description: "Ensaio: ler no máximo N editais (vazio = todos)"
        type: string
        default: ""
      ignorar_cache:
        description: "Ensaio: reler editais que já têm análise (paga de novo)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Mesma razão de `ler-recomendados`: duas execuções simultâneas não corrompem
  # o banco (o upsert de `analises_de_edital` absorve), mas pagariam duas vezes
  # pela mesma leitura se as duas consultassem o cache antes de qualquer uma
  # gravar. Grupo próprio: o lote não deve bloquear a leitura avulsa.
  group: ler-em-lote
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    # O script espera o lote por até 3 horas (`PRAZO_DE_ESPERA_MS`), mais o
    # tempo de baixar e extrair os documentos. O teto aqui precisa ser maior que
    # o prazo de espera, senão o runner mata a execução no meio e o lote fica
    # rodando e cobrando sem ninguém para aplicar o resultado.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Ver `src/lib/workflows-instalam-dependencias.test.ts` e o defeito de
      # 16/08: sem isto o script morre uma vez por edital, num passo verde.
      - name: Instalar dependências
        run: npm ci --omit=dev

      - name: Ler em lote
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SIMULAR: ${{ inputs.simular && '--simular' || '' }}
          LIMITE: ${{ inputs.limite && format('--limite={0}', inputs.limite) || '' }}
          IGNORAR_CACHE: ${{ inputs.ignorar_cache && '--ignorar-cache' || '' }}
        run: |
          set -o pipefail

          codigo=0
          node --conditions=react-server scripts/ler-em-lote.ts $SIMULAR $LIMITE $IGNORAR_CACHE \
            | tee saida-lote.txt || codigo=$?

          if [ "$codigo" = "78" ]; then
            {
              echo "## Leitura em lote não rodou — faltam segredos"
              echo
              echo "O workflow rodou e parou de propósito. Nada foi lido e nada foi gravado."
              echo
              echo "Para ligar, crie em **Settings → Secrets and variables → Actions**:"
              echo
              echo '- `NEXT_PUBLIC_SUPABASE_URL`'
              echo '- `SUPABASE_SERVICE_ROLE_KEY`'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Leitura em lote inerte::faltam segredos — ver o resumo desta execução"
            exit 0
          fi

          {
            echo "## Leitura em lote"
            echo
            echo '```'
            tail -n 40 saida-lote.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$codigo"

      - name: Publicar o log do lote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-lote
          path: saida-lote.txt
          retention-days: 30
          if-no-files-found: ignore
