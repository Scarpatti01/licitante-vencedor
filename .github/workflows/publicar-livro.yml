name: Publicar o livro no balde

# Só à mão. O livro muda quando alguém decide revisá-lo, não todo dia, e um
# cron que republica um artefato idêntico só gasta minuto de execução.
on:
  workflow_dispatch:

# Duas execuções ao mesmo tempo escreveriam o mesmo caminho no balde, e o
# resultado dependeria de quem terminasse por último.
concurrency:
  group: publicar-livro
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar o que gera o livro
        run: |
          python3 -m pip install --quiet pymupdf
          cd livro
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Gerar o PDF e o EPUB da fonte versionada
        run: |
          cd livro
          python3 montar.py
          python3 gerar-epub.py

      - name: Conferir o EPUB antes de publicar
        # A conferência é portão, não relatório: um EPUB com link quebrado ou
        # texto faltando não pode chegar a quem pagou.
        run: cd livro && python3 conferir-epub.py

      - name: Conferir o PDF antes de publicar
        # Portão, e não relatório: reprovar aqui deixa no balde o mestre
        # anterior, que já estava bom, em vez de publicar um livro quebrado
        # por cima dele.
        run: cd livro && python3 conferir-pdf.py

      - name: Enviar os mestres para o balde privado
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          cd livro
          enviar () {
            local arquivo="$1" destino="$2" tipo="$3"
            echo "enviando $arquivo ($(wc -c < "$arquivo") bytes) para $destino"
            # x-upsert para a republicação substituir o mestre em vez de falhar
            # com "já existe".
            local codigo
            codigo=$(curl -sS -o /tmp/resposta.txt -w '%{http_code}' \
              -X POST "$SUPABASE_URL/storage/v1/object/livro/$destino" \
              -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "content-type: $tipo" \
              -H "x-upsert: true" \
              --data-binary "@$arquivo")
            if [ "$codigo" != "200" ]; then
              echo "falhou com HTTP $codigo:"; cat /tmp/resposta.txt; exit 1
            fi
          }
          enviar workbook-do-licitante.pdf  mestre/workbook-do-licitante.pdf  application/pdf
          enviar workbook-do-licitante.epub mestre/workbook-do-licitante.epub application/epub+zip

      - name: Conferir que os mestres chegaram
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # Ler de volta, e não confiar no 200 do envio: o que importa é o
          # arquivo existir no balde com o tamanho certo.
          for par in "workbook-do-licitante.pdf" "workbook-do-licitante.epub"; do
            esperado=$(wc -c < "livro/$par")
            recebido=$(curl -sS \
              -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/storage/v1/object/livro/mestre/$par" | wc -c)
            echo "$par: enviado $esperado bytes, lido de volta $recebido"
            [ "$esperado" = "$recebido" ] || { echo "tamanho não bate"; exit 1; }
          done
          echo "os dois mestres estão no balde"
